    </div>

<script>
  function translateMeow() {
    const text = document.getElementById("meow-text");
    const button = document.querySelector(".translate-button");

    if (button.dataset.translated === "true") {
      text.textContent = "mew ? mii..";
      button.textContent = "translate";
      button.dataset.translated = "false";
    } else {
      text.textContent =
        "“ could you open the curtains for my sunshine to enter ? thank you. ”";
      button.textContent = "↶ meow again";
      button.dataset.translated = "true";
    }
  }
</script>

  </body>
